name: Daily Member Sync

on:
  schedule:
    # 01:00 UTC => 02:00 CET / 03:00 CEST (Europe/Oslo)
    - cron: '0 1 * * *'
  # Allow manual runs from the GitHub UI
  workflow_dispatch:

jobs:
  trigger-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Call /api/members/sync/all
        env:
          API_URL: https://topptur-og-frikjoring-fastapi.onrender.com/api/members/sync/all
          # Set this secret in GitHub: Settings → Secrets and variables → Actions
          # Name: FASTAPI_SUPERUSER_API_KEY, Value: your superuser API key
          API_KEY: ${{ secrets.fastapi_key_superuser }}
        run: |
          echo "Starting daily member sync..."

          # Call the API and capture JSON response; --fail makes curl exit on HTTP errors
          response=$(curl -sS -X POST "$API_URL" \
            -H "accept: application/json" \
            -H "X-API-Key: $API_KEY" \
            -d '' \
            --fail)

          echo "Sync completed. Response JSON:"
          echo "$response"

      - name: Log failure
        if: failure()
        run: |
          echo "Daily member sync failed. Check workflow logs for details."