name: Daily Member Sync

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
      
      - name: Fetch TF data
        id: fetch-tf
        run: |
          # TODO: Replace with actual API endpoint
          # curl -H "Authorization: Bearer ${{ secrets.TF_API_KEY }}" \
          #      https://api.tf.example.com/members > tf_data.json
          
          # For now, use test data
          cp tests/testdata/tf1.json tf_data.json
      
      - name: Fetch NTNUI data
        id: fetch-ntnui
        run: |
          # TODO: Replace with actual API endpoint
          # curl -H "Authorization: Bearer ${{ secrets.NTNUI_API_KEY }}" \
          #      https://api.ntnui.example.com/members > ntnui_data.json
          
          # For now, use test data
          cp tests/testdata/ntnui1.json ntnui_data.json
      
      - name: Run sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python sync_cli.py --tf tf_data.json --ntnui ntnui_data.json
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "Sync failed! Check logs for details."
          # TODO: Add notification (email, Slack, etc.)
